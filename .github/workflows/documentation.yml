name: Docs

# Builds the DocC documentation of the package and publishes it to GitHub Pages
# (https://tashda.github.io/<repository>/). The file is identical in every package repository that
# publishes documentation; the target to document is the one line in .github/docc-target.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish the documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version

      - name: Build the documentation
        run: |
          target=$(tr -d '[:space:]' < .github/docc-target)
          mkdir -p docs
          swift package --allow-writing-to-package-directory \
            generate-documentation --target "${target}" \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}" \
            --output-path "$(pwd)/docs"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
