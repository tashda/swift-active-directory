name: Release

# The release flow of every Echo package repository. The file is identical in all of them; copy it
# unchanged into a new repository (with generate_release_notes.py).
#
# A push to main publishes a release:
#   - if the commit already carries a version tag (vX.Y.Z), that tag is released as it is;
#   - otherwise the patch number of the latest version tag goes up by one (v0.0.1 for a first release).
# For any other number, tag the commit before pushing it to main, or run this workflow by hand and
# give the version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release exactly this version, for example 1.2.0 (empty: the next patch number)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tagged=$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)
          latest=$(git tag --list 'v[0-9]*' --merged HEAD | sort -V | tail -1)
          if [ -n "${REQUESTED}" ]; then
            next="v${REQUESTED#v}"
          elif [ -n "${tagged}" ]; then
            next="${tagged}"
          else
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            next="v${major#v}.${minor}.$((patch + 1))"
          fi
          previous=$(git tag --list 'v[0-9]*' --merged HEAD | grep -vx "${next}" | sort -V | tail -1 || true)
          create_tag=true
          if git rev-parse -q --verify "refs/tags/${next}" > /dev/null; then
            if [ "$(git rev-list -n 1 "${next}")" != "${head}" ]; then
              echo "${next} already exists on another commit" >&2
              exit 1
            fi
            create_tag=false
          fi
          echo "Releasing ${next} (previous: ${previous:-none})"
          {
            echo "tag=${next}"
            echo "previous=${previous}"
            echo "create_tag=${create_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the commit
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Write the release notes
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --new-tag "${{ steps.version.outputs.tag }}" \
            --previous-tag "${{ steps.version.outputs.previous }}" \
            --output release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "${TAG} is already released"
            exit 0
          fi
          gh release create "${TAG}" --title "Release ${TAG}" --notes-file release-notes.md --verify-tag
